<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; script-src 'self' blob:; style-src 'self' 'unsafe-inline'; connect-src https://generativelanguage.googleapis.com wss://generativelanguage.googleapis.com; worker-src blob:; media-src blob: mediastream:">
  <title>Echo — репетитор английского</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <div class="brand">Echo <span id="lesson" class="lesson"></span></div>
    <div class="controls">
      <label class="toggle" title="В наушниках можно перебивать Echo голосом">
        <input type="checkbox" id="headphones"> в наушниках
      </label>
      <button id="updateBtn" class="update" hidden title="Перезапустить Echo с новой версией">Обновить</button>
      <button id="programBtn" class="icon" title="Программа обучения"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2 4h6a4 4 0 0 1 4 4v12a3 3 0 0 0-3-3H2z"/><path d="M22 4h-6a4 4 0 0 0-4 4v12a3 3 0 0 1 3-3h7z"/></svg></button>
      <button id="themeBtn" class="icon" title="Тёмная или светлая тема"><svg viewBox="0 0 24 24" aria-hidden="true" class="i-sun"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/></svg><svg viewBox="0 0 24 24" aria-hidden="true" class="i-moon"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg></button>
      <button id="settingsBtn" class="icon" title="Настройки"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/></svg></button>
      <button id="startBtn" class="primary">Начать занятие</button>
    </div>
  </header>

  <main>
    <section class="stage">
      <div id="face" class="face"></div>
      <div id="status" class="status">Нажми «Начать занятие»</div>
    </section>
    <section id="log" class="log"></section>
  </main>

  <footer>
    <button id="micBtn" class="mic" title="Микрофон" disabled><svg viewBox="0 0 24 24" aria-hidden="true" class="i-mic"><rect x="9" y="2" width="6" height="12" rx="3"/><path d="M19 10v1a7 7 0 0 1-14 0v-1M12 18v4M8 22h8"/></svg><svg viewBox="0 0 24 24" aria-hidden="true" class="i-mic-off"><rect x="9" y="2" width="6" height="12" rx="3"/><path d="M19 10v1a7 7 0 0 1-14 0v-1M12 18v4M8 22h8"/><path d="M3 3l18 18"/></svg></button>
    <input id="textInput" type="text" placeholder="Напиши по-русски или по-английски…" autocomplete="off" disabled>
    <button id="sendBtn" disabled>Отправить</button>
  </footer>

  <div id="settings" class="overlay" hidden>
    <form id="settingsForm" class="card settings">
      <h2>Настройки</h2>

      <label class="field">
        <span>Ключ Gemini</span>
        <input id="keyInput" type="password" placeholder="Вставь ключ сюда" autocomplete="off" spellcheck="false">
        <small>Бесплатно: <a href="#" id="keyLink">aistudio.google.com</a> → Get API key → Create API key. Ключ хранится только на этом компьютере.</small>
      </label>

      <div class="field">
        <span>Стиль общения</span>
        <div id="styles" class="styles"></div>
      </div>

      <label class="field">
        <span>Голос</span>
        <select id="voiceSelect">
          <option value="Puck">Puck — бодрый</option>
          <option value="Charon">Charon — низкий, спокойный</option>
          <option value="Fenrir">Fenrir — энергичный</option>
          <option value="Kore">Kore — женский, твёрдый</option>
          <option value="Aoede">Aoede — женский, мягкий</option>
          <option value="Zephyr">Zephyr — женский, светлый</option>
        </select>
      </label>

      <div id="settingsError" class="error" hidden></div>
      <div class="actions">
        <button type="button" id="settingsCancel">Отмена</button>
        <button type="submit" id="settingsSave" class="primary">Сохранить</button>
      </div>
    </form>
  </div>

  <div id="program" class="overlay" hidden>
    <div class="card program">
      <h2>Программа</h2>
      <p id="programSummary" class="program-summary"></p>
      <p id="programHomework" class="program-homework" hidden></p>
      <p class="program-hint">Нажми на любой урок, чтобы учить его.</p>
      <div id="programList" class="program-list"></div>
      <div class="actions"><button type="button" id="programClose" class="primary">Закрыть</button></div>
    </div>
  </div>

  <script type="module" src="app.js"></script>
</body>
</html>
