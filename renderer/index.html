<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; script-src 'self' blob:; style-src 'self' 'unsafe-inline'; connect-src https://generativelanguage.googleapis.com wss://generativelanguage.googleapis.com; worker-src blob:; media-src blob: mediastream:">
  <title>Echo — репетитор английского</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <div class="brand">Echo <span id="lesson" class="lesson" title="Открыть программу"></span></div>
    <div class="controls">
      <label class="toggle" title="В наушниках можно перебивать Echo голосом">
        <input type="checkbox" id="headphones"> в наушниках
      </label>
      <button id="updateBtn" class="update" hidden title="Перезапустить Echo с новой версией">Обновить</button>
      <button id="programBtn" class="icon" title="Программа обучения">📚</button>
      <button id="themeBtn" class="icon" title="Тёмная или светлая тема">🌙</button>
      <button id="settingsBtn" class="icon" title="Настройки">⚙</button>
      <button id="startBtn" class="primary">Начать занятие</button>
    </div>
  </header>

  <main>
    <section class="stage">
      <div id="face" class="face"></div>
      <div id="status" class="status">Нажми «Начать занятие»</div>
    </section>
    <section id="log" class="log"></section>
  </main>

  <footer>
    <button id="micBtn" class="mic" title="Микрофон" disabled>🎤</button>
    <input id="textInput" type="text" placeholder="Напиши по-русски или по-английски…" autocomplete="off" disabled>
    <button id="sendBtn" disabled>Отправить</button>
  </footer>

  <div id="settings" class="overlay" hidden>
    <form id="settingsForm" class="card settings">
      <h2>Настройки</h2>

      <label class="field">
        <span>Ключ Gemini</span>
        <input id="keyInput" type="password" placeholder="Вставь ключ сюда" autocomplete="off" spellcheck="false">
        <small>Бесплатно: <a href="#" id="keyLink">aistudio.google.com</a> → Get API key → Create API key. Ключ хранится только на этом компьютере.</small>
      </label>

      <div class="field">
        <span>Стиль общения</span>
        <div id="styles" class="styles"></div>
      </div>

      <label class="field">
        <span>Голос</span>
        <select id="voiceSelect">
          <option value="Puck">Puck — бодрый</option>
          <option value="Charon">Charon — низкий, спокойный</option>
          <option value="Fenrir">Fenrir — энергичный</option>
          <option value="Kore">Kore — женский, твёрдый</option>
          <option value="Aoede">Aoede — женский, мягкий</option>
          <option value="Zephyr">Zephyr — женский, светлый</option>
        </select>
      </label>

      <div id="settingsError" class="error" hidden></div>
      <div class="actions">
        <button type="button" id="settingsCancel">Отмена</button>
        <button type="submit" id="settingsSave" class="primary">Сохранить</button>
      </div>
    </form>
  </div>

  <div id="program" class="overlay" hidden>
    <div class="card program">
      <h2>Программа</h2>
      <p id="programSummary" class="program-summary"></p>
      <p id="programHomework" class="program-homework" hidden></p>
      <div id="programList" class="program-list"></div>
      <div class="actions"><button type="button" id="programClose" class="primary">Закрыть</button></div>
    </div>
  </div>

  <script type="module" src="app.js"></script>
</body>
</html>
